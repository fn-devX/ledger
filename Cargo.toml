[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
ledger-domain = { path = "crates/domain" }
ledger-application = { path = "crates/application" }
ledger-infrastructure = { path = "crates/infrastructure" }

anyhow = "1"
argon2 = "0.6"
base64 = "0.22"
dotenvy = "0.15"
axum = { version = "0.8", features = ["macros"] }
http-body-util = "0.1"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
redis = { version = "1.7", default-features = false, features = ["script", "tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "catch-panic", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
utoipa = { version = "6", features = ["axum_extras", "uuid", "time", "preserve_order", "preserve_path_order"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
