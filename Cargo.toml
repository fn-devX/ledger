[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
ledger-domain = { path = "crates/domain" }
ledger-application = { path = "crates/application" }
ledger-infrastructure = { path = "crates/infrastructure" }
ledger-auth = { path = "crates/auth" }
ledger-events = { path = "crates/events" }
ledger-telemetry = { path = "crates/telemetry" }

anyhow = "1"
argon2 = "0.6"
async-nats = { version = "0.50", default-features = false, features = ["jetstream", "ring", "server_2_10"] }
base64 = "0.22"
dotenvy = "0.15"
futures = "0.3"
axum = { version = "0.8", features = ["macros"] }
http = "1"
http-body-util = "0.1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "grpc-tonic"] }
prost = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
redis = { version = "1.7", default-features = false, features = ["script", "tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "json", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "macros"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "catch-panic", "util"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
utoipa = { version = "6", features = ["axum_extras", "uuid", "time", "preserve_order", "preserve_path_order"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
