services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [natsdata:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 20

  notifier:
    build: .
    profiles: ["full"]
    entrypoint: ["/usr/local/bin/ledger-notifier"]
    environment:
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-insecure-dev-secret-change-me-0123456789}
      GRPC_ADDR: 0.0.0.0:50051
      LOG_FORMAT: json
      RUST_LOG: info
    ports: ["50051:50051"]
    depends_on:
      nats: { condition: service_healthy }

  api:
    build: .
    profiles: ["full"]
    environment:
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-insecure-dev-secret-change-me-0123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ledger.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ledger-admin-2026}
      LOG_FORMAT: json
      RUST_LOG: info
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }

volumes:
  pgdata:
  natsdata:
