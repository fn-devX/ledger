name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger" --health-interval 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://ledger:ledger@localhost:5432/ledger
      REDIS_URL: redis://localhost:6379
      NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Start NATS with JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2-alpine -js
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.8.6
      - name: Apply migrations
        run: sqlx migrate run
      - name: SQL query cache (.sqlx) is up to date
        run: cargo sqlx prepare --check --workspace -- --all-targets
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (pedantic)
        run: cargo clippy --workspace --all-targets
      - name: Tests (in-memory + PostgreSQL + Redis + NATS)
        run: cargo test --workspace

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
