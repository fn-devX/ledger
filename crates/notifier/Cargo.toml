[package]
name = "ledger-notifier"
description = "Notification service: projects ledger events from NATS JetStream and serves them over gRPC."
default-run = "ledger-notifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ledger-notifier"
path = "src/main.rs"

[[bin]]
name = "notify-watch"
path = "src/bin/notify-watch.rs"

[dependencies]
ledger-auth.workspace = true
ledger-telemetry.workspace = true
metrics.workspace = true
axum.workspace = true
ledger-events = { workspace = true, features = ["jetstream"] }
anyhow.workspace = true
async-nats.workspace = true
dotenvy.workspace = true
futures.workspace = true
prost.workspace = true
prost-types.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tonic-reflection.workspace = true
tracing.workspace = true
uuid.workspace = true

[build-dependencies]
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
ledger-domain.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
